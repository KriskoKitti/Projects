<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Screen</title>
    <link rel="stylesheet" href="../src/game_screen.css">
</head>
<body>
    <p id="name">Játékos: Név</p>
    <div class="whole">
        <div class="board">
            <table id="tbody" class="base_board" width="600px" height="600px"></table>
        </div>
        <div class="other">
            <div class="cardAndTime">
                <div id="card">Felhúzott kártya</div>
                <div class="timeAndMetro">
                    <div class="time">
                        <p>Eltelt idő</p>
                        <p id="clock">00:00</p>
                    </div>
                    <div id="metro">
                        <p>Metró</p>
                    </div>
            </div>
            </div>
            <div class="points">
                <div class="point_text">Pontszámítás:</div>
                <div class="points_board" id="points_board">
                    
                </div>
            </div>
            
        </div>
    </div>
    <script type="module" src="../js/game.js"></script>
</body>
</html>
